<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xe Thư Viện Lưu Động (Library Bus) — Bản Đặc Tả Thiết Kế Website (20 Screens)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Times New Roman', Times, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --color-teal: #0D7287;
      --color-teal-light: #9BE7FA;
      --color-gold: #FFD14C;
      --color-amber-bg: #FFFDF5;
      --color-bg-dark: #0B111E;
      --color-surface: #151D2E;
      --color-border: #243048;
      --color-text-light: #F8FAFC;
      --color-text-dim: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--color-bg-dark);
      color: var(--color-text-light);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Toolbar */
    .toolbar {
      height: 58px;
      background: #080D18;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--color-teal), var(--color-teal-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #062228;
    }
    .brand-tag {
      background: rgba(255, 209, 76, 0.15);
      color: var(--color-gold);
      border: 1px solid rgba(255, 209, 76, 0.4);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-light);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn:hover {
      background: #1E293B;
      border-color: var(--color-teal-light);
      color: var(--color-teal-light);
    }
    .btn.active {
      background: var(--color-teal);
      border-color: var(--color-teal-light);
      color: white;
    }

    .counter {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      background: rgba(13, 114, 135, 0.15);
      border: 1px solid rgba(13, 114, 135, 0.4);
      border-radius: 8px;
      color: var(--color-teal-light);
      white-space: nowrap;
    }

    /* Main Content Area */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Left Drawer: Table of Contents */
    .toc-drawer {
      width: 320px;
      background: #0D1424;
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 40;
    }
    .toc-drawer.collapsed {
      transform: translateX(-100%);
      margin-right: -320px;
    }
    .toc-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--color-text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-dim);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .toc-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    .toc-item.active {
      background: rgba(13, 114, 135, 0.2);
      border-color: var(--color-teal);
      color: var(--color-teal-light);
      font-weight: 700;
    }
    .toc-num {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-text-light);
      min-width: 26px;
      text-align: center;
    }
    .toc-item.active .toc-num {
      background: var(--color-teal);
      color: white;
    }

    /* Center Stage */
    .stage {
      flex: 1;
      overflow-y: auto;
      background: #070B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      scroll-behavior: smooth;
    }

    .doc-page {
      width: 100%;
      max-width: 1120px;
      background: white;
      color: #0F172A;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid #E2E8F0;
    }

    .page-header {
      background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
      border-bottom: 2px solid #E2E8F0;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .page-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      background: #0D7287;
      color: white;
    }
    .badge.gold {
      background: #FFD14C;
      color: #0F172A;
    }

    .route-chip {
      font-family: var(--font-mono);
      font-size: 11px;
      background: white;
      border: 1px solid #CBD5E1;
      padding: 3px 8px;
      border-radius: 6px;
      color: #0D7287;
      font-weight: 700;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.3;
    }

    .page-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
    }

    /* Screen Image Viewport */
    .screen-container {
      width: 100%;
      background: #F1F5F9;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: auto;
    }

    .screen-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #CBD5E1;
      transition: transform 0.2s ease;
      cursor: zoom-in;
    }
    .screen-img.zoomed {
      max-width: none;
      width: 100%;
      cursor: zoom-out;
    }

    /* Specifications Footer */
    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 24px;
      background: #FAF5FF;
      border-top: 1px solid #E9D5FF;
    }
    @media (max-width: 768px) {
      .spec-grid { grid-template-columns: 1fr; }
    }

    .spec-box {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 16px;
    }
    .spec-box-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #0D7287;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .spec-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: #334155;
    }
    .spec-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .spec-list li::before {
      content: '✓';
      color: #0D7287;
      font-weight: 800;
    }

    /* Fullscreen Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 95vw;
      max-height: 92vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: white;
      font-size: 28px;
      cursor: pointer;
      font-weight: 300;
    }
  </style>
</head>

op", "wireframeSrc": "/library-bus/screens/wf_19_faq.webp", "uiSrc": "/library-bus/screens/ui_19_faq.webp", "uiFullSrc": "/library-bus/screens/ui_19_faq.webp"}, {"id": "screen-20", "index": 20, "titleVi": "20. Liên hệ", "titleEn": "20. Contact & Feedback", "module": "public", "moduleNameVi": "Khách vãng lai & Độc giả", "moduleNameEn": "Public & Reader", "templatePath": "template/pages/contact.html", "routePath": "/contact/", "role": "Tất cả người dùng", "descVi": "Biểu mẫu và thông tin liên hệ.", "descEn": "A form and contact information.", "wireframeElements": ["Tiêu đề", "Biểu mẫu", "Khối thông tin liên hệ"], "uiFeatures": ["Tiêu đề Contact Us", "Biểu mẫu và thông tin liên hệ"], "badge": "Desktop", "wireframeSrc": "/library-bus/screens/wf_20_lien_he.webp", "uiSrc": "/library-bus/screens/ui_20_lien_he.webp", "uiFullSrc": "/library-bus/screens/ui_20_lien_he.webp"}];
    let currentIndex = 0;

    const tocList = document.getElementById('tocList');
    const tocDrawer = document.getElementById('tocDrawer');
    const pageCounter = document.getElementById('pageCounter');
    const screenBadge = document.getElementById('screenBadge');
    const screenModule = document.getElementById('screenModule');
    const screenRoute = document.getElementById('screenRoute');
    const screenTitle = document.getElementById('screenTitle');
    const screenDesc = document.getElementById('screenDesc');
    const screenImg = document.getElementById('screenImg');
    const wireframeList = document.getElementById('wireframeList');
    const uiFeaturesList = document.getElementById('uiFeaturesList');
    const stage = document.getElementById('stage');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    // Build Table of Contents
    screens.forEach((sc, idx) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === 0 ? ' active' : '');
      item.innerHTML = `
        <span class="toc-num">${sc.index}</span>
        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${sc.titleVi}</span>
      `;
      item.onclick = () => goToScreen(idx);
      tocList.appendChild(item);
    });

    function renderScreen(index) {
      if (index < 0 || index >= screens.length) return;
      currentIndex = index;
      const sc = screens[index];

      // Update counters & TOC
      pageCounter.textContent = `${index + 1} / ${screens.length}`;
      document.querySelectorAll('.toc-item').forEach((it, i) => {
        it.classList.toggle('active', i === index);
      });

      // Update Header
      screenBadge.textContent = sc.badge || 'Screen';
      screenModule.textContent = sc.moduleNameVi || sc.module;
      screenRoute.textContent = sc.routePath;
      screenTitle.textContent = `${sc.titleVi} (${sc.titleEn})`;
      screenDesc.textContent = sc.descVi;

      // Update Image
      screenImg.src = sc.uiSrc;
      screenImg.classList.remove('zoomed');

      // Update Specs
      wireframeList.innerHTML = (sc.wireframeElements || []).map(el => `<li>${el}</li>`).join('');
      uiFeaturesList.innerHTML = (sc.uiFeatures || []).map(el => `<li>${el}</li>`).join('');

      stage.scrollTop = 0;
    }

    function goToScreen(index) {
      renderScreen(index);
    }

    document.getElementById('btnPrev').onclick = () => {
      if (currentIndex > 0) goToScreen(currentIndex - 1);
    };
    document.getElementById('btnNext').onclick = () => {
      if (currentIndex < screens.length - 1) goToScreen(currentIndex + 1);
    };

    document.getElementById('btnToggleToc').onclick = () => {
      tocDrawer.classList.toggle('collapsed');
    };

    document.getElementById('btnToggleZoom').onclick = () => {
      screenImg.classList.toggle('zoomed');
    };

    screenImg.onclick = () => {
      lightboxImg.src = screenImg.src;
      lightbox.classList.add('active');
    };
    lightbox.onclick = () => {
      lightbox.classList.remove('active');
    };
    document.getElementById('lightboxClose').onclick = (e) => {
      e.stopPropagation();
      lightbox.classList.remove('active');
    };

    document.getElementById('btnFullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        if (currentIndex > 0) goToScreen(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        if (currentIndex < screens.length - 1) goToScreen(currentIndex + 1);
      } else if (e.key === 'f' || e.key === 'F') {
        document.getElementById('btnFullscreen').click();
      } else if (e.key === 'Escape') {
        lightbox.classList.remove('active');
      }
    });

    // Initial render
    renderScreen(0);
  </script>
