<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xe Thư Viện Lưu Động (Library Bus) — Mobile UX/UI Guidelines (11 Core Screens)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Times New Roman', Times, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --color-teal: #0D7287;
      --color-teal-light: #9BE7FA;
      --color-gold: #FFD14C;
      --color-bg-dark: #0B111E;
      --color-surface: #151D2E;
      --color-border: #243048;
      --color-text-light: #F8FAFC;
      --color-text-dim: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--color-bg-dark);
      color: var(--color-text-light);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .toolbar {
      height: 58px;
      background: #080D18;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--color-gold), #F59E0B);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #062228;
    }
    .brand-tag {
      background: rgba(155, 231, 250, 0.15);
      color: var(--color-teal-light);
      border: 1px solid rgba(155, 231, 250, 0.4);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-light);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn:hover {
      background: #1E293B;
      border-color: var(--color-teal-light);
      color: var(--color-teal-light);
    }
    .btn.active {
      background: var(--color-gold);
      border-color: var(--color-gold);
      color: #0F172A;
    }

    .counter {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      background: rgba(255, 209, 76, 0.15);
      border: 1px solid rgba(255, 209, 76, 0.4);
      border-radius: 8px;
      color: var(--color-gold);
      white-space: nowrap;
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Drawer */
    .toc-drawer {
      width: 300px;
      background: #0D1424;
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 40;
    }
    .toc-drawer.collapsed {
      transform: translateX(-100%);
      margin-right: -300px;
    }
    .toc-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--color-text-dim);
    }
    .toc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-dim);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .toc-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    .toc-item.active {
      background: rgba(255, 209, 76, 0.15);
      border-color: var(--color-gold);
      color: var(--color-gold);
      font-weight: 700;
    }
    .toc-num {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-text-light);
      min-width: 26px;
      text-align: center;
    }
    .toc-item.active .toc-num {
      background: var(--color-gold);
      color: #0F172A;
    }

    /* Stage */
    .stage {
      flex: 1;
      overflow-y: auto;
      background: #070B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .meta-card {
      width: 100%;
      max-width: 900px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .meta-title {
      font-size: 18px;
      font-weight: 800;
      color: white;
    }
    .meta-desc {
      font-size: 13px;
      color: var(--color-text-dim);
      line-height: 1.5;
    }

    /* Phone Mockup Frame */
    .phone-stage {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }

    .phone-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .phone-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-teal-light);
    }
    .phone-frame {
      width: 340px;
      height: auto;
      background: #1E293B;
      border: 10px solid #283548;
      border-radius: 36px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 4px rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-notch {
      width: 120px;
      height: 20px;
      background: #283548;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .phone-content {
      flex: 1;
      overflow: hidden;
      background: white;
    }
    .phone-content img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <header class="toolbar">
    <div class="brand">
      <div class="brand-icon">📱</div>
      <span>LIBRARY BUS MOBILE</span>
      <span class="brand-tag">11 CORE SCREENS MOBILE</span>
    </div>

    <div class="nav-controls">
      <button class="btn" id="btnToggleToc">
        <span>☰</span> <span class="hide-sm">Mục lục</span>
      </button>

      <button class="btn" id="btnPrev">◀</button>
      <div class="counter" id="pageCounter">1 / 11</div>
      <button class="btn" id="btnNext">▶</button>

      <button class="btn active" id="btnModeCompare">So sánh Lo-Fi & Hi-Fi</button>
    </div>
  </header>

  <!-- Workspace -->
  <main class="workspace">
    <!-- Left Drawer -->
    <aside class="toc-drawer" id="tocDrawer">
      <div class="toc-header">
        <span>11 Màn hình Điện thoại Cốt lõi</span>
      </div>
      <div class="toc-list" id="tocList"></div>
    </aside>

    <!-- Stage -->
    <section class="stage">
      <div class="meta-card">
        <div class="meta-top">
          <span style="background: var(--color-gold); color: #0F172A; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800;" id="screenBadge">Mobile Core</span>
          <span style="font-family: var(--font-mono); font-size: 11px; color: var(--color-teal-light);" id="screenRoute">/m/</span>
        </div>
        <h2 class="meta-title" id="screenTitle">1. Trang chủ Mobile</h2>
        <p class="meta-desc" id="screenDesc">Mô tả luồng giao diện mobile...</p>
      </div>

      <div class="phone-stage">
        <!-- Phone 1: Wireframe -->
        <div class="phone-wrapper">
          <div class="phone-label">📐 Wireframe (Lo-Fi)</div>
          <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="phone-content">
              <img src="" id="imgWireframe" alt="Wireframe" />
            </div>
          </div>
        </div>

        <!-- Phone 2: Final UI -->
        <div class="phone-wrapper">
          <div class="phone-label">🎨 UI Design (Hi-Fi)</div>
          <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="phone-content">
              <img src="" id="imgUi" alt="Final UI" />
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const screens = [{"id": "1", "index": 1, "titleVi": "1. Trang chủ", "titleEn": "1. Homepage (Mobile)", "module": "public", "routePath": "/", "badge": "Mobile 390×2586", "descVi": "Bản mobile 1 cột: Hero hai nút hành động, 4 thẻ chỉ số quy mô, lưới sách mới cập nhật và chuyên mục Góc nhìn & Hoạt động.", "wireframeSrc": "/library-bus/screens/wf_mobile_01_trang_chu.webp", "uiSrc": "/library-bus/screens/screen_mobile_01_trang_chu.webp"}, {"id": "2", "index": 2, "titleVi": "2. Giới thiệu", "titleEn": "2. About Us (Mobile)", "module": "public", "routePath": "/about/", "badge": "Mobile 390×2775", "descVi": "Bản mobile 1 cột: Giới thiệu Tủ Sách Lưu Động (USSH - VNU), khởi nguồn ý tưởng, 5 mục tiêu độc giả và định hướng FAST • FLEXIBLE • FUTURE.", "wireframeSrc": "/library-bus/screens/wf_mobile_02_gioi_thieu.webp", "uiSrc": "/library-bus/screens/screen_mobile_02_gioi_thieu.webp"}, {"id": "3", "index": 3, "titleVi": "3. Kho sách thư viện", "titleEn": "3. Book Catalog (Mobile)", "module": "inventory", "routePath": "/inventory/books/", "badge": "Mobile 390×760", "descVi": "Bản mobile 1 cột: Bộ lọc danh mục thu gọn, thanh tìm kiếm và danh sách thẻ sách hiển thị trạng thái tồn kho theo xe.", "wireframeSrc": "/library-bus/screens/wf_mobile_03_kho_sach.webp", "uiSrc": "/library-bus/screens/screen_mobile_03_kho_sach.webp"}, {"id": "4", "index": 4, "titleVi": "4. Chi tiết sách", "titleEn": "4. Book Detail (Mobile)", "module": "inventory", "routePath": "/inventory/books/<uuid>/", "badge": "Mobile 390×1865", "descVi": "Bản mobile 1 cột: Bìa sách, thẻ xe buýt đang lưu giữ, thông tin xuất bản, nút Đăng ký mượn sách và sách liên quan.", "wireframeSrc": "/library-bus/screens/wf_mobile_04_chi_tiet_sach.webp", "uiSrc": "/library-bus/screens/screen_mobile_04_chi_tiet_sach.webp"}, {"id": "5", "index": 5, "titleVi": "5. Quyên góp & Trao tặng sách", "titleEn": "5. Book Donation Form (Mobile)", "module": "inventory", "routePath": "/inventory/books/donate/", "badge": "Mobile 390×944", "descVi": "Bản mobile 1 cột: Biểu mẫu quyên góp sách từ cộng đồng với trường tên sách, tác giả, mô tả tình trạng và tệp đính kèm.", "wireframeSrc": "/library-bus/screens/wf_mobile_05_quyen_gop_sach.webp", "uiSrc": "/library-bus/screens/screen_mobile_05_quyen_gop_sach.webp"}, {"id": "6", "index": 6, "titleVi": "6. Mạng lưới xe buýt lưu động", "titleEn": "6. Mobile Bus Fleet Map (Mobile)", "module": "fleet", "routePath": "/inventory/buses/", "badge": "Mobile 390×743", "descVi": "Bản mobile 1 cột: Bản đồ tương tác hiển thị vị trí các xe buýt thư viện lưu động trên địa bàn Hà Nội.", "wireframeSrc": "/library-bus/screens/wf_mobile_06_danh_sach_chuyen_xe.webp", "uiSrc": "/library-bus/screens/screen_mobile_06_danh_sach_chuyen_xe.webp"}, {"id": "7", "index": 7, "titleVi": "7. Lộ trình & Điểm đón xe", "titleEn": "7. Route Detail & Stop Schedule (Mobile)", "module": "fleet", "routePath": "/inventory/routes/<uuid>/", "badge": "Mobile 390×1300", "descVi": "Bản mobile 1 cột: Bản đồ đường đi Tuyến Cầu Giấy - Thanh Xuân, trạng thái hoạt động, giờ chạy và danh sách điểm dừng kèm thời gian đỗ.", "wireframeSrc": "/library-bus/screens/wf_mobile_07_chi_tiet_lo_trinh.webp", "uiSrc": "/library-bus/screens/screen_mobile_07_chi_tiet_lo_trinh.webp"}, {"id": "8", "index": 8, "titleVi": "8. Hồ sơ cá nhân & Thẻ thư viện", "titleEn": "8. Reader Profile & Library Pass (Mobile)", "module": "users", "routePath": "/users/profile/", "badge": "Mobile 390×844", "descVi": "Bản mobile 1 cột: Quản lý tủ sách cá nhân, sách đang đọc kèm hạn trả, nút trả sách và sách đang chờ mượn.", "wireframeSrc": "/library-bus/screens/wf_mobile_08_ho_so_ban_doc.webp", "uiSrc": "/library-bus/screens/screen_mobile_08_ho_so_ban_doc.webp"}, {"id": "9", "index": 9, "titleVi": "9. Quản lý mượn trả sách", "titleEn": "9. Borrow & Return Management (Mobile)", "module": "transactions", "routePath": "/transactions/borrows/", "badge": "Mobile 390×1182", "descVi": "Bản mobile 1 cột: Danh sách giao dịch mượn trả, bộ lọc trạng thái, cảnh báo quá hạn và nút tạo phiếu mượn.", "wireframeSrc": "/library-bus/screens/wf_mobile_09_quan_ly_muon_tra.webp", "uiSrc": "/library-bus/screens/screen_mobile_09_quan_ly_muon_tra.webp"}, {"id": "10", "index": 10, "titleVi": "10. Báo cáo phân tích dữ liệu", "titleEn": "10. Operational Analytics Dashboard (Mobile)", "module": "analytics", "routePath": "/analytics/", "badge": "Mobile 390×1494", "descVi": "Bản mobile 1 cột: Dashboard thống kê cá nhân & vận hành, 4 thẻ chỉ số KPI và danh sách gợi ý sách cá nhân hóa.", "wireframeSrc": "/library-bus/screens/wf_mobile_10_analytics_dashboard.webp", "uiSrc": "/library-bus/screens/screen_mobile_10_analytics_dashboard.webp"}, {"id": "11", "index": 11, "titleVi": "11. Trung tâm quản trị Django Admin", "titleEn": "11. Django Admin Control Center (Mobile)", "module": "admin", "routePath": "/admin/", "badge": "Mobile 390×1442", "descVi": "Bản mobile 1 cột: Trung tâm quản trị cơ sở dữ liệu toàn hệ thống, phân quyền, giao dịch hàng loạt và nhật ký kiểm toán.", "wireframeSrc": "/library-bus/screens/wf_mobile_11_django_admin.webp", "uiSrc": "/library-bus/screens/screen_mobile_11_django_admin.webp"}];
    let currentIndex = 0;

    const tocList = document.getElementById('tocList');
    const tocDrawer = document.getElementById('tocDrawer');
    const pageCounter = document.getElementById('pageCounter');
    const screenBadge = document.getElementById('screenBadge');
    const screenRoute = document.getElementById('screenRoute');
    const screenTitle = document.getElementById('screenTitle');
    const screenDesc = document.getElementById('screenDesc');
    const imgWireframe = document.getElementById('imgWireframe');
    const imgUi = document.getElementById('imgUi');

    screens.forEach((sc, idx) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === 0 ? ' active' : '');
      item.innerHTML = `
        <span class="toc-num">${sc.index}</span>
        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${sc.titleVi}</span>
      `;
      item.onclick = () => goToScreen(idx);
      tocList.appendChild(item);
    });

    function renderScreen(index) {
      if (index < 0 || index >= screens.length) return;
      currentIndex = index;
      const sc = screens[index];

      pageCounter.textContent = `${index + 1} / ${screens.length}`;
      document.querySelectorAll('.toc-item').forEach((it, i) => {
        it.classList.toggle('active', i === index);
      });

      screenBadge.textContent = sc.badge || 'Mobile Screen';
      screenRoute.textContent = sc.routePath;
      screenTitle.textContent = `${sc.titleVi} (${sc.titleEn})`;
      screenDesc.textContent = sc.descVi;

      imgWireframe.src = sc.wireframeSrc;
      imgUi.src = sc.uiSrc;
    }

    function goToScreen(index) {
      renderScreen(index);
    }

    document.getElementById('btnPrev').onclick = () => {
      if (currentIndex > 0) goToScreen(currentIndex - 1);
    };
    document.getElementById('btnNext').onclick = () => {
      if (currentIndex < screens.length - 1) goToScreen(currentIndex + 1);
    };
    document.getElementById('btnToggleToc').onclick = () => {
      tocDrawer.classList.toggle('collapsed');
    };

    let viewMode = 'compare';
    const btnModeCompare = document.getElementById('btnModeCompare');
    const phoneWrappers = document.querySelectorAll('.phone-wrapper');
    btnModeCompare.onclick = () => {
      if (viewMode === 'compare') {
        viewMode = 'wf';
        btnModeCompare.textContent = 'Chỉ xem Wireframe';
        if (phoneWrappers[0]) phoneWrappers[0].style.display = 'flex';
        if (phoneWrappers[1]) phoneWrappers[1].style.display = 'none';
      } else if (viewMode === 'wf') {
        viewMode = 'ui';
        btnModeCompare.textContent = 'Chỉ xem UI Design';
        if (phoneWrappers[0]) phoneWrappers[0].style.display = 'none';
        if (phoneWrappers[1]) phoneWrappers[1].style.display = 'flex';
      } else {
        viewMode = 'compare';
        btnModeCompare.textContent = 'So sánh Lo-Fi & Hi-Fi';
        if (phoneWrappers[0]) phoneWrappers[0].style.display = 'flex';
        if (phoneWrappers[1]) phoneWrappers[1].style.display = 'flex';
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        if (currentIndex > 0) goToScreen(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        if (currentIndex < screens.length - 1) goToScreen(currentIndex + 1);
      }
    });

    renderScreen(0);
  </script>
</body>
</html>
