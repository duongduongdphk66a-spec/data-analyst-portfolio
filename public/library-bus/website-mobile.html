<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xe Thư Viện Lưu Động (Library Bus) — Mobile UX/UI Guidelines (34 Screens)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Times New Roman', Times, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --color-teal: #0D7287;
      --color-teal-light: #9BE7FA;
      --color-gold: #FFD14C;
      --color-bg-dark: #0B111E;
      --color-surface: #151D2E;
      --color-border: #243048;
      --color-text-light: #F8FAFC;
      --color-text-dim: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--color-bg-dark);
      color: var(--color-text-light);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .toolbar {
      height: 58px;
      background: #080D18;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--color-gold), #F59E0B);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #062228;
    }
    .brand-tag {
      background: rgba(155, 231, 250, 0.15);
      color: var(--color-teal-light);
      border: 1px solid rgba(155, 231, 250, 0.4);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-light);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn:hover {
      background: #1E293B;
      border-color: var(--color-teal-light);
      color: var(--color-teal-light);
    }
    .btn.active {
      background: var(--color-gold);
      border-color: var(--color-gold);
      color: #0F172A;
    }

    .counter {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      background: rgba(255, 209, 76, 0.15);
      border: 1px solid rgba(255, 209, 76, 0.4);
      border-radius: 8px;
      color: var(--color-gold);
      white-space: nowrap;
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Drawer */
    .toc-drawer {
      width: 300px;
      background: #0D1424;
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
      z-index: 40;
    }
    .toc-drawer.collapsed {
      transform: translateX(-100%);
      margin-right: -300px;
    }
    .toc-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--color-text-dim);
    }
    .toc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .toc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-dim);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .toc-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    .toc-item.active {
      background: rgba(255, 209, 76, 0.15);
      border-color: var(--color-gold);
      color: var(--color-gold);
      font-weight: 700;
    }
    .toc-num {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-text-light);
      min-width: 26px;
      text-align: center;
    }
    .toc-item.active .toc-num {
      background: var(--color-gold);
      color: #0F172A;
    }

    /* Stage */
    .stage {
      flex: 1;
      overflow-y: auto;
      background: #070B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .meta-card {
      width: 100%;
      max-width: 900px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .meta-title {
      font-size: 18px;
      font-weight: 800;
      color: white;
    }
    .meta-desc {
      font-size: 13px;
      color: var(--color-text-dim);
      line-height: 1.5;
    }

    /* Phone Mockup Frame */
    .phone-stage {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }

    .phone-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .phone-label {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-teal-light);
    }
    .phone-frame {
      width: 340px;
      height: 680px;
      background: #1E293B;
      border: 10px solid #283548;
      border-radius: 46px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 4px rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-notch {
      width: 120px;
      height: 20px;
      background: #283548;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .phone-content {
      flex: 1;
      overflow-y: auto;
      background: white;
    }
    .phone-content img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

            <div class="phone-notch"></div>
            <div class="phone-content">

          </div>
        </div>
      </div>
    </section>
  </main>

Mobile)", "module": "public", "moduleNameVi": "Khách vãng lai & Độc giả", "moduleNameEn": "Public & Reader", "templatePath": "pages/contact.html", "routePath": "/pages/contact.html", "role": "Mobile", "descVi": "Bản mobile: bố cục một cột, các khối xếp dọc. Biểu mẫu và thông tin liên hệ.", "descEn": "Mobile version: a single-column layout with blocks stacked vertically. A form and contact information.", "wireframeElements": ["Tiêu đề", "Biểu mẫu", "Khối thông tin liên hệ"], "uiFeatures": ["Tiêu đề Contact Us", "Biểu mẫu và thông tin liên hệ"], "badge": "Mobile", "wireframeSrc": "/library-bus/mobile_screens/wf_mob_03.webp", "uiSrc": "/library-bus/mobile_screens/ui_mob_03.webp", "uiFullSrc": "/library-bus/mobile_screens/ui_mob_03.webp"}];
    let currentIndex = 0;

    const tocList = document.getElementById('tocList');
    const tocDrawer = document.getElementById('tocDrawer');
    const pageCounter = document.getElementById('pageCounter');
    const screenBadge = document.getElementById('screenBadge');
    const screenRoute = document.getElementById('screenRoute');
    const screenTitle = document.getElementById('screenTitle');
    const screenDesc = document.getElementById('screenDesc');
    const imgWireframe = document.getElementById('imgWireframe');
    const imgUi = document.getElementById('imgUi');

    screens.forEach((sc, idx) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (idx === 0 ? ' active' : '');
      item.innerHTML = `
        <span class="toc-num">${sc.index}</span>
        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${sc.titleVi}</span>
      `;
      item.onclick = () => goToScreen(idx);
      tocList.appendChild(item);
    });

    function renderScreen(index) {
      if (index < 0 || index >= screens.length) return;
      currentIndex = index;
      const sc = screens[index];

      pageCounter.textContent = `${index + 1} / ${screens.length}`;
      document.querySelectorAll('.toc-item').forEach((it, i) => {
        it.classList.toggle('active', i === index);
      });

      screenBadge.textContent = sc.badge || 'Mobile Screen';
      screenRoute.textContent = sc.routePath;
      screenTitle.textContent = `${sc.titleVi} (${sc.titleEn})`;
      screenDesc.textContent = sc.descVi;

      imgWireframe.src = sc.wireframeSrc;
      imgUi.src = sc.uiSrc;
    }

    function goToScreen(index) {
      renderScreen(index);
    }

    document.getElementById('btnPrev').onclick = () => {
      if (currentIndex > 0) goToScreen(currentIndex - 1);
    };
    document.getElementById('btnNext').onclick = () => {
      if (currentIndex < screens.length - 1) goToScreen(currentIndex + 1);
    };
    document.getElementById('btnToggleToc').onclick = () => {
      tocDrawer.classList.toggle('collapsed');
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        if (currentIndex > 0) goToScreen(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        if (currentIndex < screens.length - 1) goToScreen(currentIndex + 1);
      }
    });

    renderScreen(0);
  </script>
