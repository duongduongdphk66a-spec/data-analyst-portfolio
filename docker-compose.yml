version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: user_password_here
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: portfolio-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://portfolio_user:user_password_here@db:3306/portfolio_db
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - ADMIN_PASSWORD=change_this_to_a_long_secure_password_16_chars_min
    depends_on:
      - db

volumes:
  mysql_data:
